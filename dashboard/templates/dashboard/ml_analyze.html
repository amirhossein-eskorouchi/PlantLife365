{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-3">ML Analysis Report</h2>

  {% if report_html %}
    <div id="reportArea">{{ report_html|safe }}</div>
  {% else %}
    <div class="alert alert-info">No report available. This page is intended to display a full ML report returned by the server.</div>
  {% endif %}

  <div class="mt-3">
    <a href="{% url 'ml_tool' %}" class="btn btn-outline-secondary">Back to ML Tool</a>
  </div>
</div>

{% endblock %}
