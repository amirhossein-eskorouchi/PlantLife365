<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlantLife365 - Password Changed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #11998e, #38ef7d, #0f9b0f, #7FFF00);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .leaf {
            position: absolute;
            width: 15rem;
            height: 15rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50% 0 50% 0;
            animation: float 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        .leaf-1 {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            transform: rotate(15deg);
        }

        .leaf-2 {
            bottom: 10%;
            right: 10%;
            animation-delay: -4s;
            transform: rotate(105deg);
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .icon {
            font-size: 4rem;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #2c3e50;
        }

        p {
            color: #7f8c8d;
            font-size: 1.05rem;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(17, 153, 142, 0.4);
            color: white;
        }
    </style>
</head>

<body>
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>
    <div class="login-container">
        <i class="fas fa-check-circle icon"></i>
        <h2>Password Changed!</h2>
        <p>Your password has been set. You may go ahead and log in now.</p>
        <a href="{% url 'login' %}" class="btn btn-primary">Sign In</a>
    </div>
</body>

</html>
