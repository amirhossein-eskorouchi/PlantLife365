<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Your Device - PlantLife365</title>
    <!-- Use Tailwind CSS specifically requested by user framework or vanilla. Here I use Bootstrap as the current project uses it -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap');

        body {
            background-color: #f4f6f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Background blur circles for premium look */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.3;
        }

        .c-1 {
            width: 300px;
            height: 300px;
            background: #11998e;
            top: -50px;
            left: -50px;
        }

        .c-2 {
            width: 400px;
            height: 400px;
            background: #38ef7d;
            bottom: -100px;
            right: -50px;
        }

        .device-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .device-header {
            margin-bottom: 2rem;
        }

        .device-header i {
            font-size: 3rem;
            color: #11998e;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .device-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .device-header p {
            color: #6c757d;
            font-size: 0.95rem;
        }

        .form-floating {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            padding: 1rem 0.75rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(17, 153, 142, 0.25);
            border-color: #11998e;
        }

        .btn-submit {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 50px;
            padding: 12px 0;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(17, 153, 142, 0.4);
            color: white;
        }

        .btn-skip {
            color: #6c757d;
            background: transparent;
            border: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            text-decoration: underline;
        }

        .btn-skip:hover {
            color: #2c3e50;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            background: #f8ffff;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #dc3545;
        }

        .qr-placeholder {
            margin: 1.5rem 0;
            padding: 1.5rem;
            background: #f8f9fa;
            border: 2px dashed #ced4da;
            border-radius: 10px;
            color: #adb5bd;
        }

        .qr-placeholder i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="bg-circle c-1"></div>
    <div class="bg-circle c-2"></div>

    <div class="device-container">
        <div class="device-header">
            <i class="fas fa-microchip"></i>
            <h2>Pair Your Device</h2>
            <p>Enter the Device ID and Password found on your prototype device to connect it to your
                dashboard.</p>
        </div>

        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
        </div>
        {% endif %}

        <!-- NEW QR SCANNER SECTION -->
        <div class="mb-4">
            <button type="button" id="startScanBtn" class="btn btn-outline-primary w-100 py-2 rounded-pill fw-bold" style="border-width: 2px;">
                <i class="fas fa-qrcode me-2"></i> Scan QR Code with Camera
            </button>
            <div id="qr-reader" class="mt-3 mx-auto shadow-sm" style="display: none; width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid #11998e; background: #fff;"></div>
        </div>
        
        <div class="text-muted mb-3 fw-bold" style="font-size: 0.85rem; letter-spacing: 1px;">— OR ENTER MANUALLY —</div>

        <form method="POST" action="{% url 'add_device' %}">
            {% csrf_token %}

            <div class="form-floating">
                <input type="text" class="form-control" id="deviceIdInput" name="device_id"
                    placeholder="e.g. ESP32-PL-001" required>
                <label for="deviceIdInput">Device ID</label>
            </div>

            <div class="form-floating">
                <input type="text" class="form-control" id="devicePinInput" name="secret_pin" placeholder="e.g. 123456"
                    required>
                <label for="devicePinInput">Device Password</label>
            </div>

            <button type="submit" name="action" value="submit" class="btn btn-submit mt-3">
                Connect Device <i class="fas fa-link ms-1"></i>
            </button>
            <br>
            <button type="submit" name="action" value="skip" class="btn btn-skip" formnovalidate>
                Skip for now, I'll do this later
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const scanBtn = document.getElementById('startScanBtn');
            const qrReader = document.getElementById('qr-reader');
            const deviceIdInput = document.getElementById('deviceIdInput');
            const devicePinInput = document.getElementById('devicePinInput');
            let html5QrcodeScanner = null;

            scanBtn.addEventListener('click', function() {
                if (html5QrcodeScanner) return; // Already running
                
                qrReader.style.display = 'block';
                scanBtn.style.display = 'none';

                function onScanSuccess(decodedText, decodedResult) {
                    // Try parsing the QR logic
                    try {
                        const data = JSON.parse(decodedText);
                        if (data.device_id) deviceIdInput.value = data.device_id;
                        if (data.secret_pin) devicePinInput.value = data.secret_pin;
                    } catch (e) {
                        // Fallback: Check if it's comma separated "ESP32-001,123456"
                        const parts = decodedText.split(',');
                        if (parts.length >= 2) {
                            deviceIdInput.value = parts[0].trim();
                            devicePinInput.value = parts[1].trim();
                        } else {
                            // Last resort
                            deviceIdInput.value = decodedText;
                        }
                    }
                    
                    // Stop scanning and cleanup
                    html5QrcodeScanner.clear().then(() => {
                        qrReader.style.display = 'none';
                        scanBtn.style.display = 'block';
                        scanBtn.innerHTML = '<i class="fas fa-check-circle"></i> Scanned successfully!';
                        scanBtn.classList.replace('btn-outline-primary', 'btn-success');
                        
                        // Brief success flash
                        deviceIdInput.style.backgroundColor = '#e8f5e9';
                        devicePinInput.style.backgroundColor = '#e8f5e9';
                        setTimeout(() => {
                            deviceIdInput.style.backgroundColor = '';
                            devicePinInput.style.backgroundColor = '';
                        }, 1000);
                    });
                }

                html5QrcodeScanner = new Html5QrcodeScanner(
                    "qr-reader",
                    { fps: 10, qrbox: {width: 250, height: 250} },
                    /* verbose= */ false);
                html5QrcodeScanner.render(onScanSuccess, (err) => {});
            });
        });
    </script>
</body>

</html>
